<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Packs</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding-top: 180px;
            background: #f5f5f5;
            font-family: Tahoma, Arial, sans-serif;
        }

        /* عکس ثابت بالای صفحه */
        .top-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 180px;
            object-fit: cover;
            z-index: 9999;
            background: white;
        }

        .content {
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #16a34a;
        }

        /* کارت مپ Backrooms */
        .map-link {
            text-decoration: none;
            color: inherit;
            display: inline-block;
            margin-top: 20px;
        }

        .map-card {
            width: 280px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            text-align: right;
            transition: 0.2s;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .map-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        /* فقط عکس‌های داخل کارت مپ */
        .map-slider {
            position: relative;
            width: 100%;
            height: 180px;
            overflow: hidden;
        }

        .map-slider img {
            position: absolute;
            width: 100%;
            height: 180px;
            object-fit: cover;
            top: 0;
            right: 0;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .map-slider img.active {
            opacity: 1;
        }

        .map-info {
            padding: 15px;
        }

        .map-info h2 {
            font-size: 18px;
            margin: 0 0 10px;
            color: #222;
        }

        .description {
            font-size: 13px;
            color: #666;
            line-height: 1.8;
            height: 45px;
            overflow: hidden;
        }

        .price {
            color: #e6123d;
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0;
        }

        .map-card button {
            width: 100%;
            border: none;
            padding: 10px;
            background: #e6123d;
            color: white;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <img class="top-image" src="moz.jpg" alt="Minecraft Packs">

    <div class="content">

        <h1>🎮 Minecraft Packs</h1>

        <p>
            به Minecraft Packs خوش آمدید!
        </p>

        <p>
            پک مورد نظر را انتخاب کنید.
        </p>

        <!-- مپ Backrooms -->
        <a href="backrooms map.html" class="map-link">
            <div class="map-card">

                <!-- اسلاید عکس‌های مپ -->
                <div class="map-slider">
                    <img src="b1.webp" alt="مپ بکرومز 1" class="active">
                    <img src="b2.webp" alt="مپ بکرومز 2">
                    <img src="b3.webp" alt="مپ بکرومز 3">
                    <img src="b4.webp" alt="مپ بکرومز 4">
                </div>

                <div class="map-info">
                    <h2>مپ ترسناک بکرومز</h2>

                    <p class="description">
                        وارد دنیای ترسناک و مرموز Backrooms شوید!
                    </p>

                    <div class="price">
                        ۱۰۰,۰۰۰ تومان
                    </div>

                    <button type="button">
                        مشاهده مپ
                    </button>
                </div>

            </div>
        </a>

        <div style="height:1000px;"></div>

    </div>

    <script>
        const images = document.querySelectorAll(".map-slider img");
        let currentImage = 0;

        setInterval(() => {
            images[currentImage].classList.remove("active");

            currentImage++;

            if (currentImage >= images.length) {
                currentImage = 0;
            }

            images[currentImage].classList.add("active");

        }, 5000);
    </script>

</body>
</html>
