<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Packs</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding-top: 180px;
            background: #f5f5f5;
            font-family: Tahoma, Arial, sans-serif;
        }

        /* عکس ثابت بالای صفحه */
        .top-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 180px;
            object-fit: cover;
            z-index: 9999;
            background: white;
        }

        .content {
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #16a34a;
        }
    </style>
</head>

<body>

    <img class="top-image" src="moz.jpg" alt="Minecraft Packs">

    <div class="content">

        <h1>🎮 Minecraft Packs</h1>

        <p>
            به Minecraft Packs خوش آمدید!
        </p>

        <p>پک مورد نظر را انتخاب کنید.
        </p>

        <div style="height:1000px;"></div>

    </div>

</body>
</html>
