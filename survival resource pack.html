<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Survival Resource Pack | Minecraft Packs</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5fff8;
            font-family: Tahoma, Arial, sans-serif;
            color: #333;
        }

        header {
            background: #16a34a;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 35px auto;
        }

        .map {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 20px #ddd;
        }

        /* عکس‌های ریسورس پک */
        .map-slider {
            position: relative;
            width: 100%;
            height: 500px;
            overflow: hidden;
            border-radius: 15px;
        }

        .map-slider img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .map-slider img.active {
            opacity: 1;
        }

        h1 {
            color: white;
        }

        h2 {
            color: #16a34a;
            font-size: 30px;
        }

        .info {
            background: #f0fff4;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .price {
            color: #16a34a;
            font-size: 25px;
            font-weight: bold;
        }

        .buy {
            background: #16a34a;
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-size: 18px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #16a34a;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        /* موبایل */
        @media (max-width: 600px) {

            .container {
                width: 95%;
                margin: 20px auto;
            }

            .map {
                padding: 15px;
            }

            .map-slider {
                height: 280px;
            }

            h2 {
                font-size: 24px;
            }

        }

    </style>
</head>

<body>

    <header>
        <h1>🎮 Minecraft Packs</h1>
    </header>


    <div class="container">

        <div class="map">

            <!-- عکس‌ها هر ۵ ثانیه تغییر می‌کنند -->
            <div class="map-slider">

                <img
                    src="survival.webp"
                    alt="Survival Resource Pack 1"
                    class="active"
                >

                <img
                    src="survival2.webp"
                    alt="Survival Resource Pack 2"
                >

            </div>


            <h2>🎨 ریسورس پک سروایوال</h2>

            <p>
                یک ریسورس پک جذاب برای زیباتر و بهتر شدن دنیای سروایوال ماینکرفت.
            </p>


            <div class="info">

                <b>🎮 نسخه Minecraft:</b>
                1.21.4

                <br><br>

                <b>📦 نوع:</b>
                Resource Pack

                <br><br>

                <b>✨ شامل:</b>
                بهبود ظاهر و زیبایی دنیای سروایوال

            </div>


            <p class="price">
                💰 قیمت: ۵۰,۰۰۰ تومان
            </p>


            <div class="buy">

                📱 جهت خرید به این شماره پیام دهید:

                <br><br>

                <b>09918423558</b>

            </div>


            <a class="back" href="index.html">
                ⬅️ برگشت به Minecraft Packs
            </a>

        </div>

    </div>


    <script>

        /* تغییر عکس‌ها هر ۵ ثانیه */

        const mapImages =
            document.querySelectorAll(".map-slider img");

        let currentImage = 0;


        setInterval(() => {

            mapImages[currentImage]
                .classList.remove("active");

            currentImage =
                (currentImage + 1) % mapImages.length;

            mapImages[currentImage]
                .classList.add("active");

        }, 5000);

    </script>

</body>
</html>
