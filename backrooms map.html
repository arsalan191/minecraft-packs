<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <title>Survival Map | Minecraft Packs</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5fff8;
            font-family: Tahoma, Arial, sans-serif;
            color: #333;
        }

        header {
            background: #16a34a;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 35px auto;
        }

        .map {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 20px #ddd;
        }

        .map-slider {
            position: relative;
            width: 100%;
            height: 500px;
            overflow: hidden;
            border-radius: 15px;
        }

        .map-slider img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .map-slider img.active {
            opacity: 1;
        }

        h1 {
            color: white;
        }

        h2 {
            color: #16a34a;
            font-size: 30px;
        }

        .info {
            background: #f0fff4;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .price {
            color: #16a34a;
            font-size: 25px;
            font-weight: bold;
        }

        .buy {
            background: #16a34a;
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-size: 18px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #16a34a;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎮 Minecraft Packs</h1>
    </header>

    <div class="container">

        <div class="map">

            <!-- عکس‌های بزرگ مپ: هر ۵ ثانیه تغییر می‌کنند -->
            <div class="map-slider">
                <img src="b1.webp" alt="Backrooms Map 1" class="active">
                <img src="b2.webp" alt="Backrooms Map 2">
                <img src="b3.webp" alt="Backrooms Map 3">
                <img src="b4.webp" alt="Backrooms Map 4">
            </div>

            <h2>🏠 bakrooms Map</h2>

            <p>
               یک مپ ترسناک بکرومز  Minecraft
                .
            </p>

            <div class="info">

                <b>🎮 نسخه Minecraft:</b>
                1.21.4

                <br><br>

                <b>📦 نوع:</b>
                horror

                <br><br>

                <b>🏠 شامل:</b>
                ترسناکیت

            </div>

            <p class="price">
                💰 قیمت: 100,000 تومان
            </p>

            <div class="buy">

                📱 جهت خرید به این شماره پیام دهید:

                <br><br>

                <b>09918423558</b>

            </div>

            <a class="back" href="packs.html">
                ⬅️ برگشت به Minecraft Packs
            </a>

        </div>

    </div>

    <script>
        const mapImages = document.querySelectorAll(".map-slider img");
        let currentImage = 0;

        setInterval(() => {
            mapImages[currentImage].classList.remove("active");
            currentImage = (currentImage + 1) % mapImages.length;
            mapImages[currentImage].classList.add("active");
        }, 5000);
    </script>

</body>
</html>
